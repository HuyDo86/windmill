value:
  content: >
    """

    You are an expert in accounting, finance, and inventory management for
    construction businesses in Vietnam.


    Extract the following fields from the text related to stock receipt note
    (Phiếu nhập kho) OCR text in JSON format:


    - document_number: The code/number of the stock receipt note (Số phiếu nhập
    kho, e.g. "PNK01", "01/NK")

    - date: The date of the note in YYYY-MM-DD HH:MM:SS format

    - debit_account: Debit account code (Tài khoản Nợ, e.g. "152", "156", "153")

    - credit_account: Credit account code (Tài khoản Có, e.g. "331", "111",
    "112")

    - supplier: The name of the organization supplying/delivering the goods (Đơn
    vị giao hàng / Nhà cung cấp)

    - supplier_representative: The name of the person representing the supplier
    / deliverer (Họ tên người giao hàng)

    - supplier_email: email of the supplier

    - supplier_phone: phone number of the supplier

    - supplier_address: address of the supplier

    - receiver: The name of the organization receiving the goods (Đơn vị nhận /
    Công ty nhập kho)

    - receiver_representative: The name of the person representing the receiver
    (e.g. warehouse keeper / thủ kho / người nhận)

    - receiver_email: email of the receiver

    - receiver_phone: phone number of the receiver

    - creator_name: Name of the person who created the stock receipt note (Người
    lập phiếu)

    - approver_name: Name of the person approving the receipt (Kế toán trưởng /
    Giám đốc / Thủ trưởng đơn vị)

    - contract: Contract name or number (Theo hợp đồng số)

    - invoice (Số hóa đơn): Invoice number or name (Theo hóa đơn số)

    - delivery_location: The warehouse (nhà kho) or construction site that the
    received stock will arrive at (Nhập tại kho)

    - issued_from: The warehouse (nhà kho), location or storage that sent the
    items (Địa điểm xuất / Nguồn hàng)

    - reason: Reason for stock receipt (Lý do nhập kho, e.g., "Nhập mua mới",
    "Nhập kho điều chuyển", "Nhập thừa hoàn trả")

    - items (A list of products/services being received):
       - code: Product code (Mã số vật tư)
       - name: Product name (Tên, quy cách vật tư hàng hóa)
       - unit: Đơn vị tính (ĐVT) MUST extract valid units like: kg, tấn, tạ, yến, bao, cây, m, m2, m3, bộ, cái, viên, thùng, hộp...
       - quantity_doc: Quantity on document/invoice (Số lượng theo chứng từ) (float)
       - quantity_real: Quantity actually received into warehouse (Số lượng thực nhập) (float)
       - unit_price: Unit price (Đơn giá, float in VND)
       - amount: Amount (Thành tiền = quantity_real * unit_price, float in VND)
    - total_amount (tổng số tiền): The total amount of money for all of the
    products/services (float, in VND, cannot be negative) (Normalize to float
    VND using Vietnamese money units: k=1 thousand, lít/xị/lốp/l=1 hundred
    thousand, tr/củ/chai/m=1 million, b/t/tỏi=1 billion; support mixed notation
    (e.g., 3tr -> 3.000.000); apply the same magnitude logic to unseen slang;
    bare numbers <1000 -> thousands. e.g. 1tr3 -> 1300000; 400k -> 400000; 260
    -> 260000; 5l -> 500000, 50 -> 50000)

    - total_amount_in_words: Total amount in words (Số tiền bằng chữ)

    - note: Any other notable details or description (Ghi chú)

    - project (dự án): The project that the stock receipt note is associated
    with (if any)

    - attached_documents: Original supporting documents attached (e.g. "Phiếu
    giao hàng", "Biên bản nghiệm thu vật tư")


    **SPECIAL HANDLING RULES FOR 100% OCR FIDELITY**:

    1. STRICT EXTRACTION & NO OMISSION: Read through the entire OCR text from
    start to finish. Extract ALL item rows in the table into `items` without
    skipping any row. Do not truncate, summarize, or skip any product line from
    the OCR text.

    2. PRESERVE EXACT VALUES: Maintain exact product names, quantities, unit
    prices, units of measure, and document codes from the OCR text.

    3. BLURRY / LOW-QUALITY TEXT: Infer missing or blurry words/digits based on
    accounting logic, context, and standard Vietnamese money/unit notation. Do
    not guess randomly; if a field cannot be identified, return null.


    Example: "Nhập 1,5 tấn sỏi về kho CS Nhâm CT2 của anh Tuấn nhôm CN cho dự án
    Ms Thu Hương"

    - supplier: "anh Tuấn nhôm CN"

    - issued_from: "CS Nhâm CT2"

    - items: [{{"code": null, "name": "sỏi", "unit": "tấn", "quantity_doc": 1.5,
    "quantity_real": 1.5, "unit_price": null, "amount": null}}]

    - project: "Ms Thu Hương"


    Extract the fields in JSON format. Use null for any field that cannot be
    found.


    Current date and time: {date_time}


    Input text from OCR:

    ----------------

    {ocr_text}

    ----------------


    IMPORTANT: Respond with ONLY a valid JSON object matching this exact
    structure, no markdown code fences, no explanation text before or after:

    {{"document_number": "<string or null>", "date": "<string or null>",
    "debit_account": "<string or null>", "credit_account": "<string or null>",
    "supplier": "<string or null>", "supplier_representative": "<string or
    null>", "supplier_email": "<string or null>", "supplier_phone": "<string or
    null>", "supplier_address": "<string or null>", "receiver": "<string or
    null>", "receiver_representative": "<string or null>", "receiver_email":
    "<string or null>", "receiver_phone": "<string or null>", "creator_name":
    "<string or null>", "approver_name": "<string or null>", "contract":
    "<string or null>", "invoice": "<string or null>", "delivery_location":
    "<string or null>", "issued_from": "<string or null>", "reason": "<string or
    null>", "items": [{{"code": "<string or null>", "name": "<string or null>",
    "unit": "<string or null>", "quantity_doc": <number or null>,
    "quantity_real": <number or null>, "unit_price": <number or null>, "amount":
    <number or null>}}], "total_amount": <number or null>,
    "total_amount_in_words": "<string or null>", "note": "<string or null>",
    "project": "<string or null>", "attached_documents": "<string or null>"}}


    Your Response:

    """

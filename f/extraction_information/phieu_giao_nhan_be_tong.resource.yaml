value:
  content: >-
    """

    You are an expert in civil engineering, concrete batching logistics, and
    ready-mix concrete delivery tickets (Phiếu giao nhận bê tông / Phiếu xuất
    xưởng bê tông thương phẩm) in Vietnam.


    Extract the following specialized fields from the concrete delivery ticket
    OCR text in JSON format:


    - document_number: Concrete dispatch ticket number (Số phiếu xuất xưởng / Số
    phiếu giao bê tông, e.g. "BT-00192", "12345/PXK")

    - date: Date of concrete delivery (in YYYY-MM-DD format)

    - supplier: Ready-mix concrete supplier company name (Tên đơn vị cung cấp bê
    tông / Công ty Bê tông)

    - plant_location: Batching plant location / name (Trạm sản xuất bê tông /
    Trạm trộn)

    - customer: Customer / contractor receiving concrete (Tên khách hàng / Nhà
    thầu nhận bê tông)

    - project: Name of the construction project (Tên dự án / Công trình)

    - construction_item: Construction component / item being poured (Hạng mục
    thi công, e.g., "Cột dầm sàn tầng 3", "Móng mố N2", "Sàn mái")

    - delivery_location: Pouring site address or location (Vị trí / Địa điểm
    giao bê tông)

    - concrete_grade: Concrete strength grade / mix grade (Mác bê tông, e.g.,
    "M200", "M250", "M300", "M350", "M400", "C30")

    - slump: Concrete slump specification and test result (Độ sụt cm, e.g.,
    "12±2", "14±2", "10±2")

    - additive: Concrete additives used (Phụ gia bê tông, e.g., "R7", "R14",
    "Chống thấm B8", "Phụ gia đông kết nhanh")

    - stone_size: Aggregate / stone size (Cỡ đá, e.g., "Đá 1x2", "Đá 0.5x1")

    - volume_m3: Concrete volume for this truck dispatch in cubic meters (Khối
    lượng chuyến xe này m3, float)

    - accumulated_volume_m3: Cumulative total concrete volume delivered to date
    for this pour (Khối lượng cộng dồn m3, float)

    - batch_number: Batch mix code or recipe code (Mã cấp phối / Số mẻ trộn)

    - driver_name: Name of the mixer truck driver (Họ tên tài xế / Lái xe bồn)

    - truck_number: License plate or ID of the mixer truck (Biển kiểm soát xe
    bồn / Số xe bồn, e.g. "29C-987.65", "Xe 08")

    - pump_type: Concrete pump method/type (Loại bơm, e.g., "Bơm cần", "Bơm
    tĩnh", "Đổ xả trực tiếp")

    - pump_code: Pump truck license plate or team code (Số xe bơm / Tên đội bơm)

    - time_leaving_plant: Time leaving batching plant (Giờ xe xuất trạm, e.g.
    "08:15" or "YYYY-MM-DD 08:15")

    - time_arriving_site: Time arriving at site (Giờ xe đến công trình, e.g.
    "08:45")

    - time_starting_pour: Time starting concrete discharge (Giờ bắt đầu đổ / xả,
    e.g. "08:50")

    - time_finishing_pour: Time finishing concrete discharge (Giờ kết thúc đổ,
    e.g. "09:30")

    - receiver_signature_name: Printed name of the site engineer / receiver
    signing (Họ tên người nhận / Giám sát công trình)

    - driver_signature_name: Printed name of the driver signing (Họ tên tài xế
    ký)

    - note: Technical comments or notes (Ghi chú, e.g., "Đã thử độ sụt tại công
    trình đạt 14cm")


    **SPECIAL HANDLING RULES FOR 100% OCR FIDELITY**:

    1. STRICT EXTRACTION & NO OMISSION: Read through the entire OCR text from
    start to finish. Extract 100% of all concrete technical fields and
    timestamps. Do not skip, summarize, or truncate any field present in the
    input OCR text.

    2. PRESERVE EXACT VALUES: Maintain exact concrete grade (M200-M400), slump
    values, timestamps (giờ xuất trạm, giờ đến, giờ xả, giờ xong), and truck
    license numbers from the OCR text.

    3. BLURRY / LOW-QUALITY TEXT: Infer missing or blurry digits/words based on
    concrete physics and accounting logic. Do not guess randomly; if a field
    cannot be identified, return null.


    Extract the fields in JSON format. Use null for any field that cannot be
    found.


    Current date and time: {date_time}


    Input text from OCR:

    ----------------

    {ocr_text}

    ----------------


    IMPORTANT: Respond with ONLY a valid JSON object matching this exact
    structure, no markdown code fences, no explanation text before or after:

    {{"document_number": "<string or null>", "date": "<string or null>",
    "supplier": "<string or null>", "plant_location": "<string or null>",
    "customer": "<string or null>", "project": "<string or null>",
    "construction_item": "<string or null>", "delivery_location": "<string or
    null>", "concrete_grade": "<string or null>", "slump": "<string or null>",
    "additive": "<string or null>", "stone_size": "<string or null>",
    "volume_m3": <number or null>, "accumulated_volume_m3": <number or null>,
    "batch_number": "<string or null>", "driver_name": "<string or null>",
    "truck_number": "<string or null>", "pump_type": "<string or null>",
    "pump_code": "<string or null>", "time_leaving_plant": "<string or null>",
    "time_arriving_site": "<string or null>", "time_starting_pour": "<string or
    null>", "time_finishing_pour": "<string or null>",
    "receiver_signature_name": "<string or null>", "driver_signature_name":
    "<string or null>", "note": "<string or null>"}}


    Your Response:

    """
